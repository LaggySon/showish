name: CI

# Runs on every pull request, and on the branches we deploy from, so a red
# build always points at a specific change rather than at "some time last week".
on:
  push:
    branches: [dev, main]
  pull_request:

# A second push to a branch makes the first run's answer irrelevant, so stop it
# rather than paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: mix precommit
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test

    # The suite talks to a real database — Ecto's SQL sandbox rolls each test
    # back rather than faking the repo — so CI needs one alongside it. These
    # credentials are what config/test.exs falls back to.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # Phoenix 1.8 needs Elixir 1.15 or newer (see mix.exs). Pinned to a minor
      # series rather than a patch so security patches are picked up, but a new
      # minor never lands on the project without somebody choosing it.
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      # Compiled dependencies are the slow part and only change when mix.lock
      # does. _build is keyed on the run as well, so a stale artefact can never
      # outlive the source it was built from.
      - name: Restore the dependency cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}-
            ${{ runner.os }}-mix-

      - name: Fetch dependencies
        run: mix deps.get --check-locked

      # The checks below are `mix precommit`, run one at a time so a failure
      # names itself, and in the read-only form CI needs: precommit's `format`
      # and `deps.unlock --unused` rewrite files, which is right on a laptop and
      # useless on a runner that throws its disk away.
      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      - name: Run the test suite
        run: mix test

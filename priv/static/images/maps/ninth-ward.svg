<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Ninth Ward">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a141a"/>
      <stop offset="0.6" stop-color="#1d3a41"/>
      <stop offset="1" stop-color="#3d6b64"/>
    </linearGradient>
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16262a"/>
      <stop offset="1" stop-color="#070e11"/>
    </linearGradient>
    <pattern id="windows" width="42" height="52" patternUnits="userSpaceOnUse">
      <rect width="42" height="52" fill="none"/>
      <rect x="10" y="12" width="18" height="24" fill="#ffcf7a" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#sky)"/>
  <circle cx="230" cy="150" r="38" fill="#e8f2e4" opacity="0.5"/>

  <!-- distant skyline -->
  <g fill="#0e1f24" opacity="0.85">
    <rect x="40" y="330" width="90" height="140"/>
    <rect x="150" y="292" width="70" height="178"/>
    <rect x="240" y="348" width="110" height="122"/>
    <rect x="900" y="308" width="86" height="162"/>
    <rect x="1010" y="342" width="120" height="128"/>
    <rect x="1150" y="300" width="90" height="170"/>
  </g>

  <!-- rowhouses -->
  <g>
    <rect x="80" y="392" width="200" height="188" fill="#132a2c"/>
    <path d="M80 392 L180 340 L280 392 Z" fill="#0d2022"/>
    <rect x="300" y="418" width="180" height="162" fill="#17322f"/>
    <path d="M300 418 L390 372 L480 418 Z" fill="#0d2022"/>
    <rect x="500" y="400" width="210" height="180" fill="#122a2b"/>
    <path d="M500 400 L605 352 L710 400 Z" fill="#0d2022"/>
    <rect x="730" y="424" width="180" height="156" fill="#17322f"/>
    <path d="M730 424 L820 380 L910 424 Z" fill="#0d2022"/>
    <rect x="930" y="404" width="200" height="176" fill="#132a2c"/>
    <path d="M930 404 L1030 356 L1130 404 Z" fill="#0d2022"/>
  </g>

  <!-- lit windows -->
  <g>
    <rect x="94" y="410" width="172" height="104" fill="url(#windows)"/>
    <rect x="314" y="436" width="152" height="104" fill="url(#windows)"/>
    <rect x="514" y="418" width="182" height="104" fill="url(#windows)"/>
    <rect x="744" y="442" width="152" height="104" fill="url(#windows)"/>
    <rect x="944" y="422" width="172" height="104" fill="url(#windows)"/>
  </g>

  <rect y="580" width="1280" height="140" fill="url(#street)"/>

  <!-- street lamps and their pools of light -->
  <g>
    <ellipse cx="240" cy="612" rx="120" ry="26" fill="#ffcf7a" opacity="0.13"/>
    <ellipse cx="740" cy="612" rx="120" ry="26" fill="#ffcf7a" opacity="0.13"/>
    <rect x="236" y="486" width="7" height="112" fill="#0a1517"/>
    <circle cx="239" cy="482" r="11" fill="#ffcf7a" opacity="0.9"/>
    <rect x="736" y="486" width="7" height="112" fill="#0a1517"/>
    <circle cx="739" cy="482" r="11" fill="#ffcf7a" opacity="0.9"/>
  </g>

  <g fill="#3f5c5b" opacity="0.5">
    <rect x="60" y="646" width="120" height="6"/>
    <rect x="330" y="646" width="120" height="6"/>
    <rect x="600" y="646" width="120" height="6"/>
    <rect x="870" y="646" width="120" height="6"/>
    <rect x="1140" y="646" width="120" height="6"/>
  </g>
</svg>

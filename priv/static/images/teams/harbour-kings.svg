<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Harbour Kings">
  <defs>
    <linearGradient id="hkField" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3f78"/>
      <stop offset="1" stop-color="#0d1f3d"/>
    </linearGradient>
  </defs>

  <!-- roundel: a self-contained badge, so the mark reads on any plate colour -->
  <circle cx="128" cy="128" r="120" fill="url(#hkField)"/>
  <circle cx="128" cy="128" r="120" fill="none" stroke="#f2f6ff" stroke-width="8"/>
  <circle cx="128" cy="128" r="104" fill="none" stroke="#7fb0e8" stroke-width="3" opacity="0.55"/>

  <!-- crown -->
  <path d="M74 104 L74 74 L96 92 L128 62 L160 92 L182 74 L182 104 Z" fill="#f4c14e"/>
  <rect x="74" y="110" width="108" height="13" rx="2" fill="#f4c14e"/>
  <circle cx="74" cy="70" r="7" fill="#f2f6ff"/>
  <circle cx="128" cy="56" r="8" fill="#f2f6ff"/>
  <circle cx="182" cy="70" r="7" fill="#f2f6ff"/>

  <!-- anchor -->
  <g fill="none" stroke="#f2f6ff" stroke-width="10" stroke-linecap="round">
    <path d="M128 140 L128 200"/>
    <path d="M104 156 L152 156"/>
    <path d="M92 178 C 96 204, 160 204, 164 178"/>
  </g>
  <circle cx="128" cy="138" r="11" fill="none" stroke="#f2f6ff" stroke-width="9"/>
</svg>
